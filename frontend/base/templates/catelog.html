{% extends 'main.html' %}
{% load static %}

{% block title %}
<title>LMS | Catelog</title>
<link rel="stylesheet" href="{% static 'styles/basestyle.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center my-3">
        <a class="ms-auto btn btn-outline-dark" href="{% url 'catelog' %}">
            View All
        </a>
    </div>

    <div class="row g-4">
        {% for i in data %}
        <div class="col-md-4 col-lg-3">
            <div class="book-card">
                <div>

                    <img class="card-img-top"
                        src="http://localhost:8000/static{{i.cover_image}}">
                </div>
                <div class="book-content">
                    <span class="category">
                        {{i.category.name}}
                    </span>
                    <h5>{{i.title|truncatechars:25}}</h5>
                    <p class="author">
                        <i class="bi bi-person-fill"></i>
                        {{i.authors.name|default:"N/A"}}
                    </p>
                    <a href="{% url 'details' i.id  %}" class="btn btn-dark w-100">
                        <i class="bi bi-book"></i>
                        Borrow Book
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
