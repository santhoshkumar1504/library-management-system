<!DOCTYPE html>
<html>
<head>
    <title>Categories</title>
</head>
<body>

<h2>Book Categories</h2>

<table border="1">

<tr>

<th>ID</th>

<th>Name</th>

<th>Description</th>

</tr>

{% for category in categories %}

<tr>

<td>{{ category.id }}</td>

<td>{{ category.name }}</td>

<td>{{ category.description }}</td>



</tr>

{% endfor %}

</table>

</body>
</html>
