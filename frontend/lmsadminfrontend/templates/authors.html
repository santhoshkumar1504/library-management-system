<!DOCTYPE html>
<html>
<head>
    <title>Authors</title>
</head>
<body>

<h2>Authors</h2>

<table border="1">

<tr>

<th>ID</th>

<th>Name</th>

<th>Biography</th>

</tr>

{% for author in authors %}

<tr>

<td>{{ author.id }}</td>

<td>{{ author.name }}</td>

<td>{{ author.biography }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
