{% extends 'main.html' %}
{% load static %}

{% block title %}
<title>Change Password</title>
<link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">
{% endblock %}

{% block content %}
<div class="container form-container">
    <h2>Change Password</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>
    {{ message }}
</div>
{% endblock %}
