{% extends 'main.html' %}
{% load static %}

{% block title %}
    <title>Reset Password</title>
<link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">

{% endblock %}

{% block content %}
    <div class="container form-container">
        <h2>Reset Password</h2>
        
        <form method="POST">
            {% csrf_token %}
        
            {{ form.as_p }}
        
            <button type="submit" class="btn-primary">
                Reset Password
            </button>
        
        </form>
        
        {{ message }}
    </div>
{% endblock %}
