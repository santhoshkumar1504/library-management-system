{% extends 'main.html' %}
{% load static %}

{% block title %}
    <title>Update Profile</title>
    <link rel="stylesheet" href="{% static 'styles/formstyle.css' %}">

{% endblock %}

{% block content %}
    <div class="container form-container">

        <h2>Update Profile</h2>
        
        {% if profile.profile_image %}
        
        <img src="http://127.0.0.1:8000{{ profile.profile_image }}"
        width="150"
        height="150">
        
        <br><br>
        
        {% endif %}
        
        <form method="POST" enctype="multipart/form-data">
        
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-outline-primary">
        
        Update Profile
        
        </button>
        
        </form>
        
        <br>
        
        {{ message }}
    </div>
{% endblock %}
